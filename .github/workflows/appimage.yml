name: Build and publish AppImages

on:
  pull_request:
  push:
    branches: main
  release:
    types: published

jobs:
  build:
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Expose slug values
        uses: rlespinasse/github-slug-action@v5

      - name: Expose version
        run: echo "VERSION=$(git describe --tags --always --dirty)" >>"${GITHUB_ENV}"

      - name: Setup buildx for docker
        uses: docker/setup-buildx-action@v4

      - name: Build AppImage
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          outputs: build
          build-args: |
            VERSION
            OWNER=${{ env.GITHUB_REPOSITORY_OWNER_PART }}

      - name: Test AppImage
        run: |
          run() {
            app="${1}"
            timeout 5 "${app}"
            rc="$?"
            if [ "$rc" -eq 124 ]; then
              echo "AppImage started successfully."
            else
              echo "AppImage returned unexpected code $rc."
              [ "$rc" -eq 0 ] && exit 1 || exit "$rc"
            fi
          }
          find build -type f -name '*.AppImage' | while read -r appimage; do
            run "${appimage}"
          done | grep .

      - uses: rlespinasse/slugify-value@v1
        id: platform-slug
        with:
          key: PLATFORM
          value: ${{ matrix.platform }}
          publish-env: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: appimage-${{ steps.platform-slug.outputs.slug-url }}
          path: |
            build/*.AppImage
            build/*.AppImage.zsync
          if-no-files-found: error

  test:
    runs-on: ${{ matrix.runner }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: rlespinasse/slugify-value@v1
        id: platform-slug
        with:
          key: PLATFORM
          value: ${{ matrix.platform }}
          publish-env: false

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: assets
          pattern: appimage-${{ steps.platform-slug.outputs.slug-url }}

      - uses: addnab/docker-run-action@v3
        with:
          image: alpine
          options: -v ${{ github.workspace }}/assets:/appimage
          run: |
            run() {
              app="${1}"
              timeout 5 "${app}"
              rc="$?"
              if [ "$rc" -eq 124 ]; then
                echo "AppImage started successfully."
              else
                echo "AppImage returned unexpected code $rc."
                [ "$rc" -eq 0 ] && exit 1 || exit "$rc"
              fi
            }
            find /appimage/ -type f -name '*.AppImage' | while read -r appimage; do
              chmod +x "${appimage}"
              run "${appimage}"
            done

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    needs:
      - build

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: appimage-*
          merge-multiple: true
      - name: Create checksum for release assets
        shell: bash
        run: |
          algo="${SHA_ALGORITHM:-256}"
          find assets -type f | while read -r asset; do
            shasum --binary --algorithm "${algo}" "${asset}" >"${asset}.sha${algo}"
          done
      - name: Upload artifacts to GitHub release
        uses: softprops/action-gh-release@v1
        with:
          files: assets/*
