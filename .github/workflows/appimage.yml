name: Build and publish AppImages

on:
  pull_request:
  push:
    branches: main
  release:
    types: published

env:
  RUNNER_VERSION: 26.04

jobs:
  build:
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-${{ env.RUNNER_VERSION }}
          - platform: linux/arm64
            runner: ubuntu-${{ env.RUNNER_VERSION }}-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Expose slug values
        uses: rlespinasse/github-slug-action@v5

      - name: Expose version
        run: echo "VERSION=$(git describe --tags --always --dirty)" >>"${GITHUB_ENV}"

      - name: Setup buildx for docker
        uses: docker/setup-buildx-action@v4

      - name: Build AppImage
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          outputs: build
          build-args: |
            VERSION
            OWNER=${{ env.GITHUB_REPOSITORY_OWNER_PART }}

      - name: Test AppImage
        run: |
          set -eu
          run() {
            app="${1}"
            timeout 5 "${app}"
            rc="$?"
            if [ "$rc" -ne 124 ]; then
              echo >&2 "Application returned unexpected code $rc."
              [ "$rc" -eq 0 ] && exit 1 || exit "$rc"
            fi
          }
          find build -type f -name '*.AppImage' | while read -r appimage; do
            run "${appimage}"
          done

      - uses: rlespinasse/slugify-value@v1
        id: platform-slug
        with:
          key: PLATFORM
          value: ${{ matrix.platform }}
          publish-env: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: appimage-${{ steps.platform-slug.outputs.slug-url }}
          path: |
            build/*.AppImage
            build/*.AppImage.zsync
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-${{ env.RUNNER_VERSION }}

    needs:
      - build

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: appimage-*
          merge-multiple: true
      - name: Create checksum for release assets
        shell: bash
        run: |
          algo="${SHA_ALGORITHM:-256}"
          find assets -type f | while read -r asset; do
            shasum --binary --algorithm "${algo}" "${asset}" >"${asset}.sha${algo}"
          done
      - name: Upload artifacts to GitHub release
        uses: softprops/action-gh-release@v1
        with:
          files: assets/*
